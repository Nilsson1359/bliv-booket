# fuldtbooketmusiker.dk: Cloudflare Worker = statiske filer (_site/) + Meta CAPI-relay (worker.js).
# Byg: ./build.sh   Deploy: npx wrangler deploy   Secret: npx wrangler secret put META_CAPI_TOKEN
name = "fuldtbooketmusiker"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "fuldtbooketmusiker.dk", custom_domain = true },
  { pattern = "www.fuldtbooketmusiker.dk", custom_domain = true },
]
[assets]
directory = "./_site"
binding = "ASSETS"
# videoer går gennem Worker for byte-range (206), som iPhone/Safari kræver
run_worker_first = ["/media/ev/stem/*", "/media/ev/v/*", "/media/clips/*"]
[vars]
META_PIXEL_ID = "1708597793574696"
# GHL (Oscars egen konto) til /firmafest + /bryllup. Token = secret GHL_TOKEN (Private Integration, alle scopes, 20/10 2026).
# Tom kalender-id = fast skema (hverdage 9-17) + kun D1/Telegram for den side.
GHL_LOCATION_ID = "SPqCnUSSBeiJmWIf74nm"
GHL_CALENDAR_FIRMAFEST = "QM0iD9QoOnEdnpRHkb2C"   # "Oscartjoensson - funnel - Firmafest", oprettet via API 21/10 som kopi af bryllup
GHL_CALENDAR_BRYLLUP = "OrUzjog2RIXctk5UA7sF"     # "Oscartjoensson - funnel - Bryllup"

[[d1_databases]]
binding = "DB"
database_name = "fbm-analytics"
database_id = "3a75c854-14a7-4193-ac09-a13e17a6ff22"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
